components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminSessionAuth:
      type: apiKey
      in: cookie
      name: beavend_admin_session
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: Admin session token passed as Bearer

  parameters:
    ProjectIDHeader:
      name: X-Project-ID
      in: header
      required: true
      schema:
        type: string
      example: proj_ecommerce
    EnvironmentHeader:
      name: X-Environment
      in: header
      required: true
      schema:
        type: string
        enum: [development, staging, production]
      example: development
    RequestIDHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      example: req_01HP3KX7Z

  responses:
    400Error:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    401Error:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    403Error:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    404Error:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    422Error:
      description: Guardrail blocked request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    429Error:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    502Error:
      description: Upstream provider error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    503Error:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    504Error:
      description: Tool execution timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Modality:
      type: string
      enum: [text, image, audio, video, document]

    MediaRef:
      type: object
      description: Reference to media in object storage. Generated media is returned as a signed URL, never inlined.
      properties:
        media_id:
          type: string
        mime_type:
          type: string
        digest:
          type: string
        url:
          type: string
        caption:
          type: string
        filename:
          type: string
        size:
          type: integer
          format: int64
      required:
        - mime_type

    MessagePart:
      type: object
      properties:
        type:
          type: string
          enum: [text, media, tool_call, tool_result]
        text:
          type: string
        media:
          $ref: "#/components/schemas/MediaRef"
        tool_call:
          type: object
        tool_result:
          type: object
      required:
        - type

    Attachment:
      type: object
      properties:
        type:
          type: string
          enum: [image, audio, video, document]
        mime_type:
          type: string
        url:
          type: string
          description: HTTPS URL fetched via the SSRF-safe dialer.
        data:
          type: string
          format: byte
          description: Base64 inline content (size-limited).
      required:
        - type
        - mime_type

    ModelRoutes:
      type: object
      description: Per-app routing rules, compiled into the snapshot. First matching rule wins; otherwise default.
      properties:
        default:
          type: string
          description: Logical model used when no rule matches.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ModelRouteRule"
      required:
        - default

    ModelRouteRule:
      type: object
      properties:
        when:
          $ref: "#/components/schemas/RouteCondition"
        use:
          type: string
          description: Logical model name.
      required:
        - when
        - use

    RouteCondition:
      type: object
      properties:
        input_has:
          type: array
          items:
            $ref: "#/components/schemas/Modality"
        output:
          type: array
          items:
            $ref: "#/components/schemas/Modality"
        metadata:
          type: object
          additionalProperties:
            type: string
        expr:
          type: string
          description: Optional CEL expression (ADR-004).

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        parts:
          type: array
          description: Canonical parts (text, media, tool_call, tool_result). Generated media appears here as signed-URL media parts.
          items:
            $ref: "#/components/schemas/MessagePart"
      required:
        - role
        - content

    ChatRequest:
      type: object
      properties:
        thread_id:
          type: string
          description: Optional server-side conversation thread ID
        model:
          type: string
          description: Optional explicit logical model, honored only if allowed by policy; otherwise routing rules apply.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        output_modalities:
          type: array
          description: Requested output modalities. Defaults to [text]; never inferred from prompt text.
          items:
            $ref: "#/components/schemas/Modality"
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - messages

    UsageStats:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        cost_usd:
          type: number
      required:
        - input_tokens
        - output_tokens
        - total_tokens

    ChatResponse:
      type: object
      properties:
        id:
          type: string
        request_id:
          type: string
        ai_app_id:
          type: string
        thread_id:
          type: string
        created_at:
          type: integer
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
        usage:
          $ref: "#/components/schemas/UsageStats"
      required:
        - id
        - request_id
        - ai_app_id
        - created_at
        - message
        - finish_reason
        - usage

    Thread:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        environment:
          type: string
        ai_app_id:
          type: string
        issuer:
          type: string
        subject:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        metadata:
          type: object
        ttl_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - environment
        - ai_app_id

    AIAppMetadata:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retry_after:
          type: integer
        details:
          type: object
      required:
        - code
        - message

    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - role

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AdminUser"
      required:
        - token
        - user

    CreateAdminUserRequest:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
      required:
        - email
        - password
        - role

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name

    CreateProjectRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name

    CreateEnvironmentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name

    AdminAIApp:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        model_routing_id:
          type: string
          deprecated: true
          description: Legacy; migrated to model_routes.default. Used only if model_routes is omitted.
        model_routes:
          $ref: "#/components/schemas/ModelRoutes"
        prompt_id:
          type: string
        memory_enabled:
          type: boolean
        search_enabled:
          type: boolean
        rate_limit_rpm:
          type: integer
        token_quota_monthly:
          type: integer
        tools:
          type: array
          items:
            type: string
        skill_ids:
          type: array
          items:
            type: string
        policies:
          type: array
          items:
            type: string
        auth:
          $ref: "#/components/schemas/AppAuthConfig"
      required:
        - id
        - name

    AppAuthConfig:
      type: object
      description: Per-app identity provider authentication configuration
      properties:
        provider:
          type: string
          enum: [firebase, supabase, oidc, jwt, anonymous]
          description: Identity provider type (firebase, supabase, oidc, jwt, anonymous)
        issuer:
          type: string
          description: Expected JWT token issuer (iss claim)
        audience:
          type: array
          items:
            type: string
          description: Expected JWT token audiences (aud claim)
        jwks_url:
          type: string
          description: HTTPS URL to fetch JWKS public key set for token verification
        project_id:
          type: string
          description: Identity provider project ID (for Firebase)
        allow_anonymous:
          type: boolean
          description: If true, allows requests without an Authorization header

    AdminPrompt:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active_version:
          type: integer
        latest_version:
          type: integer
      required:
        - id
        - name

    PromptVersion:
      type: object
      properties:
        prompt_id:
          type: string
        version:
          type: integer
        template:
          type: string
        input_variables:
          type: array
          items:
            type: string
        commit_message:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - template

    ModelRouting:
      type: object
      properties:
        logical_model:
          type: string
        deployment:
          type: string
        adapter:
          type: string
        fallback_models:
          type: array
          description: Ordered failover chain of fallback deployments, supporting cross-provider routing (e.g. "openai/gpt-4o-mini", "groq/llama-3.3-70b", or "claude-3-haiku").
          items:
            type: string
        fallback_deployments:
          type: array
          description: Ordered failover chain of fallback deployments, supporting cross-provider routing (e.g. "openai/gpt-4o-mini", "groq/llama-3.3-70b", or "claude-3-haiku").
          items:
            type: string
        input_cost_per_1m:
          type: number
          format: double
          description: Optional custom USD rate per 1 Million prompt/input tokens. Overrides default catalog pricing.
        output_cost_per_1m:
          type: number
          format: double
          description: Optional custom USD rate per 1 Million completion/output tokens. Overrides default catalog pricing.
        retry_max_attempts:
          type: integer
        input_modalities:
          type: array
          description: Capability metadata (validation and dashboard pickers only; never used to route). Defaults to [text].
          items:
            $ref: "#/components/schemas/Modality"
        output_modalities:
          type: array
          description: Capability metadata (validation only). Rules routing to an incapable model are rejected on publish; fallbacks must be equal-or-superset.
          items:
            $ref: "#/components/schemas/Modality"
      required:
        - logical_model
        - deployment
        - adapter

    ProviderConfig:
      type: object
      properties:
        provider_name:
          type: string
        base_url:
          type: string
        api_key:
          type: string
        is_active:
          type: boolean
      required:
        - provider_name

    AdminTool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        schema:
          type: object
        execution_type:
          type: string
          enum: [http, webhook, mcp, sql_template, client_side]
        http_endpoint:
          type: string
        http_method:
          type: string
        template:
          type: string
          description: Parameterized SQL template for sql_template executor
        side_effect:
          type: string
          enum: [read, write]
        confirmation:
          type: string
          enum: [none, required]
        timeout_ms:
          type: integer
        identity_bindings:
          type: object
      required:
        - id
        - name

    AdminPolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active_version:
          type: integer
        latest_version:
          type: integer
      required:
        - id
        - name

    PolicyVersion:
      type: object
      properties:
        policy_id:
          type: string
        version:
          type: integer
        expression:
          type: string
        action:
          type: string
          enum: [allow, deny, redact, sanitize]
        reject_code:
          type: string
        reject_message:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - expression
        - action

    AdminSkill:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        environment:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string
        injection_mode:
          type: string
          enum: [always, on_demand]
        active_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name

    SkillVersion:
      type: object
      properties:
        id:
          type: string
        skill_id:
          type: string
        project_id:
          type: string
        environment:
          type: string
        version:
          type: integer
        content:
          type: string
        variables:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - content

    SkillDetails:
      type: object
      properties:
        skill:
          $ref: "#/components/schemas/AdminSkill"
        active_version:
          $ref: "#/components/schemas/SkillVersion"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/SkillVersion"
      required:
        - skill

    ImportSkillRequest:
      type: object
      required:
        - source
      properties:
        id:
          type: string
        source:
          type: string
          description: Skills.sh URL, GitHub tree/blob URL, or npx skills add CLI command
        injection_mode:
          type: string
          enum: [always, on_demand]
        save:
          type: boolean

    ImportSkillResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string
        resolved_url:
          type: string
        injection_mode:
          type: string
          enum: [always, on_demand]
        content:
          type: string
        raw_markdown:
          type: string
        variables:
          type: array
          items:
            type: string
        saved:
          type: boolean
        skill:
          $ref: "#/components/schemas/AdminSkill"
        active_version:
          $ref: "#/components/schemas/SkillVersion"

