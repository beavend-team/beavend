openapi: 3.1.0
info:
  title: Beavend API
  description: The self-hosted AI application backend API for mobile, web, and client applications.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns 200 OK if the process is running.
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status

  /readyz:
    get:
      summary: Readiness probe
      description: Returns 200 OK if snapshot and dependencies are ready.
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  role:
                    type: string
                    example: all
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not_ready

  /v1/apps/{ai_app_id}:
    get:
      summary: Get AI App metadata
      description: Retrieves public metadata for the specified AI App.
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
      responses:
        "200":
          description: AI App metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAppMetadata"
        "401":
          $ref: "#/components/responses/401Error"
        "404":
          $ref: "#/components/responses/404Error"

  /v1/apps/{ai_app_id}/chat:
    post:
      summary: Unary Chat Completion
      description: Executes a synchronous, non-streaming chat request against the specified AI App.
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
        - $ref: "#/components/parameters/RequestIDHeader"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/400Error"
        "401":
          $ref: "#/components/responses/401Error"
        "403":
          $ref: "#/components/responses/403Error"
        "422":
          $ref: "#/components/responses/422Error"
        "429":
          $ref: "#/components/responses/429Error"
        "502":
          $ref: "#/components/responses/502Error"

  /v1/apps/{ai_app_id}/stream:
    post:
      summary: Streaming Chat Completion (SSE)
      description: Establishes a Server-Sent Events stream for low-latency token delivery.
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
        - $ref: "#/components/parameters/RequestIDHeader"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/400Error"
        "401":
          $ref: "#/components/responses/401Error"
        "403":
          $ref: "#/components/responses/403Error"
        "422":
          $ref: "#/components/responses/422Error"
        "429":
          $ref: "#/components/responses/429Error"

  /v1/apps/{ai_app_id}/confirm:
    post:
      summary: Confirm Suspended Tool Execution
      description: Resumes a request paused awaiting explicit human confirmation.
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation_token:
                  type: string
                approved:
                  type: boolean
              required:
                - confirmation_token
                - approved
      responses:
        "200":
          description: Continued chat response or stream
        "401":
          $ref: "#/components/responses/401Error"
        "403":
          $ref: "#/components/responses/403Error"

  /v1/apps/{ai_app_id}/tool-results:
    post:
      summary: Submit Client-Side Tool Results
      description: Submits results of client-side executed tools back to the agent loop.
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                continuation_token:
                  type: string
                call_id:
                  type: string
                result:
                  type: object
              required:
                - continuation_token
                - call_id
                - result
      responses:
        "200":
          description: Continued chat response or stream

  /v1/apps/{ai_app_id}/cancel:
    post:
      summary: Cancel active request
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type: string
              required:
                - request_id
      responses:
        "200":
          description: Request successfully cancelled

  /v1/apps/{ai_app_id}/threads:
    post:
      summary: Create conversation thread
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"

  /v1/apps/{ai_app_id}/threads/{thread_id}:
    get:
      summary: Get conversation thread
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Thread retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        "404":
          $ref: "#/components/responses/404Error"
    delete:
      summary: Delete conversation thread
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Thread deleted

  /v1/apps/{ai_app_id}/jobs/{job_id}:
    get:
      summary: Get asynchronous media job status
      description: Returns the status and result of an asynchronous media generation job (e.g. video generation).
      parameters:
        - name: ai_app_id
          in: path
          required: true
          schema:
            type: string
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ProjectIDHeader"
        - $ref: "#/components/parameters/EnvironmentHeader"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Job status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  project_id:
                    type: string
                  ai_app_id:
                    type: string
                  model:
                    type: string
                  modality:
                    type: string
                  status:
                    type: string
                    enum: [queued, processing, completed, failed]
                  result:
                    type: object
                  error:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/404Error"

  /v1/media/{project_id}/{media_id}:
    get:
      summary: Retrieve media object
      description: Serves a media object with HMAC signature and expiration verification.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: media_id
          in: path
          required: true
          schema:
            type: string
        - name: exp
          in: query
          required: true
          description: UNIX timestamp when the signed URL expires
          schema:
            type: integer
            format: int64
        - name: sig
          in: query
          required: true
          description: HMAC signature authenticating the media request
          schema:
            type: string
      responses:
        "200":
          description: Media binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Invalid or expired signature
        "404":
          description: Media object not found

  /v1/admin/health:
    get:
      summary: Control plane health check
      description: Returns 200 OK if control plane components are operational.
      responses:
        "200":
          description: Control plane is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  control_plane:
                    type: string
                    example: ready

  /v1/admin/auth/login:
    post:
      summary: Admin login
      description: Authenticates administrative credentials and sets session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/401Error"

  /v1/admin/auth/logout:
    post:
      summary: Admin logout
      description: Invalidates and clears administrative session cookie.
      responses:
        "200":
          description: Logout successful

  /v1/admin/auth/me:
    get:
      summary: Current admin profile
      description: Returns information about the currently authenticated administrator.
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Admin user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/401Error"

  /v1/admin/users:
    get:
      summary: List admin users
      description: Lists all administrative users (Owner role required).
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          $ref: "#/components/responses/403Error"
    post:
      summary: Create admin user
      description: Provisions a new admin user account (Owner role required).
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          $ref: "#/components/responses/403Error"

  /v1/admin/users/{id}:
    delete:
      summary: Delete admin user
      description: Removes an administrative user (Owner role required).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Admin user deleted
        "403":
          $ref: "#/components/responses/403Error"

  /v1/admin/projects:
    get:
      summary: List projects
      description: Returns all configured projects.
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      summary: Create project
      description: Provisions a new project tenant (Owner role required).
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /v1/admin/projects/{project_id}:
    get:
      summary: Get project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    put:
      summary: Update project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      summary: Delete project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Project deleted

  /v1/admin/projects/{project_id}/environments:
    get:
      summary: List environments
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Environments list
    post:
      summary: Create environment
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Environment created

  /v1/admin/projects/{project_id}/environments/{name}:
    delete:
      summary: Delete environment
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Environment deleted

  /v1/admin/projects/{project_id}/environments/{name}/auth:
    get:
      summary: Get environment auth provider configuration
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Environment auth configuration
    put:
      summary: Update environment auth provider configuration
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated auth configuration

  /v1/admin/projects/{project_id}/environments/{name}/export:
    get:
      summary: Export project environment configuration as declarative YAML
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Declarative YAML configuration document
          content:
            application/x-yaml:
              schema:
                type: string

  /v1/admin/projects/{project_id}/environments/{name}/import:
    post:
      summary: Import and reconcile declarative YAML or JSON project configuration
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns the computed diff plan without modifying the database.
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Computed diff report or apply result
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  environment:
                    type: string
                  summary:
                    type: object
                    properties:
                      total_created:
                        type: integer
                      total_updated:
                        type: integer
                      total_unchanged:
                        type: integer

  /v1/admin/auth/test-token:
    post:
      summary: Test and verify end-user JWT token against environment auth provider
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "200":
          description: Token verification result with normalized claims

  /v1/admin/apps:
    get:
      summary: List AI Apps
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of AI Apps
    post:
      summary: Create AI App
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAIApp"
      responses:
        "201":
          description: AI App created

  /v1/admin/apps/{id}:
    get:
      summary: Get AI App
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: AI App details
    put:
      summary: Update AI App
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAIApp"
      responses:
        "200":
          description: AI App updated
    delete:
      summary: Delete AI App
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: AI App deleted

  /v1/admin/apps/{id}/keys:
    get:
      summary: List App API Keys
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of App API keys
    post:
      summary: Generate App API Key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                expires_in_days:
                  type: integer
      responses:
        "201":
          description: App API key generated with one-time token

  /v1/admin/apps/{id}/keys/{key_id}:
    delete:
      summary: Revoke App API Key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: App API key revoked

  /v1/admin/prompts:
    get:
      summary: List Prompts
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of Prompts
    post:
      summary: Create Prompt
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPrompt"
      responses:
        "201":
          description: Prompt created

  /v1/admin/prompts/{id}:
    get:
      summary: Get Prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Prompt details
    put:
      summary: Update Prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                template:
                  type: string
                variables:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Prompt updated
    delete:
      summary: Delete Prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: Prompt deleted

  /v1/admin/prompts/{id}/versions:
    post:
      summary: Create Prompt Version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptVersion"
      responses:
        "201":
          description: Prompt version created

  /v1/admin/prompts/{id}/active-version:
    put:
      summary: Set Active Prompt Version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: integer
      responses:
        "200":
          description: Active version updated

  /v1/admin/skills:
    get:
      summary: List Skills
      security:
        - AdminSessionAuth: []
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of skills
          content:
            application/json:
              schema:
                type: array
                items:
