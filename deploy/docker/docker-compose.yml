services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: beavend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beavend
      POSTGRES_PASSWORD: beavend
      POSTGRES_DB: beavend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beavend -d beavend"]
      interval: 3s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: beavend-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: beavend-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  beavend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: beavend-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      BEAVEND_ENV: development
      BEAVEND_ROLE: all
      BEAVEND_HTTP_PORT: 8080
      BEAVEND_DATABASE_URL: postgres://beavend:beavend@postgres:5432/beavend?sslmode=disable
      BEAVEND_REDIS_URL: redis://valkey:6379/0
      BEAVEND_SEARXNG_URL: http://searxng:8080
      BEAVEND_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BEAVEND_ADMIN_EMAIL: admin@beavend.local
      BEAVEND_ADMIN_PASSWORD: adminpassword123
      BEAVEND_LOG_LEVEL: debug
      BEAVEND_LOG_FORMAT: json

volumes:
  postgres_data:
  valkey_data:

