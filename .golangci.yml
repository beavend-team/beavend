run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - depguard
    - govet
    - staticcheck
    - revive
    - gofmt
    - ineffassign
    - misspell
    - unconvert
    - errcheck

linters-settings:
  depguard:
    rules:
      prevent_control_from_outside:
        list-mode: lax
        files:
          - "!**/cmd/**"
          - "!**/internal/control/**"
        deny:
          - pkg: "github.com/beavend/beavend/internal/control"
            desc: "Only cmd may import internal/control"
      prevent_runtime_from_outside:
        list-mode: lax
        files:
          - "!**/cmd/**"
          - "!**/internal/runtime/**"
        deny:
          - pkg: "github.com/beavend/beavend/internal/runtime"
            desc: "Only cmd may import internal/runtime"
      core_isolation:
        list-mode: lax
        files:
          - "**/internal/core/**"
        deny:
          - pkg: "github.com/beavend/beavend/internal/**"
            desc: "internal/core must not import other internal packages"
